services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS}
      OPENAPI_PATH: ${OPENAPI_PATH}
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
      JWT_REFRESH_TTL_SECONDS: ${JWT_REFRESH_TTL_SECONDS:-604800}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      PROFORMA_COMPANY_ADDRESS_LINE1: ${PROFORMA_COMPANY_ADDRESS_LINE1:-}
      PROFORMA_COMPANY_ADDRESS_LINE2: ${PROFORMA_COMPANY_ADDRESS_LINE2:-}
      PROFORMA_COMPANY_CITY: ${PROFORMA_COMPANY_CITY:-}
      PROFORMA_COMPANY_STATE: ${PROFORMA_COMPANY_STATE:-}
      PROFORMA_COMPANY_POSTAL_CODE: ${PROFORMA_COMPANY_POSTAL_CODE:-}
      PROFORMA_COMPANY_COUNTRY: ${PROFORMA_COMPANY_COUNTRY:-}
      PROFORMA_COMPANY_PHONE: ${PROFORMA_COMPANY_PHONE:-}
      PROFORMA_COMPANY_EMAIL: ${PROFORMA_COMPANY_EMAIL:-}
      PROFORMA_ACCOUNT_NAME: ${PROFORMA_ACCOUNT_NAME:-}
      PROFORMA_ACCOUNT_NUMBER: ${PROFORMA_ACCOUNT_NUMBER:-}
      PROFORMA_IBAN: ${PROFORMA_IBAN:-}
      PROFORMA_BANK_NAME: ${PROFORMA_BANK_NAME:-}
      PROFORMA_BANK_ADDRESS: ${PROFORMA_BANK_ADDRESS:-}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_MICROSOFT_CLIENT_ID: ${VITE_MICROSOFT_CLIENT_ID}
        VITE_MICROSOFT_TENANT_ID: ${VITE_MICROSOFT_TENANT_ID}
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  minio_data:
