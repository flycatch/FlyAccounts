openapi: 3.0.3
info:
  title: FlyAccounts
  description: >
    Single source of truth for Microsoft authentication, session tokens,
    combined-permission landing, optional invite, organization-based entry,
    and Settings (Users, Roles, Permissions). The backend MUST implement this
    document. The frontend MUST generate its client from this document and
    MUST NOT use unofficial endpoints or hand-written parallel auth, people,
    or role shapes. FastAPI auto-generated OpenAPI is not the contract.

    Breaking change from 3.0.0: Settings gated by manage_users / manage_roles /
    manage_permissions; GET /permissions returns modules[]; catalog items use
    name/permission/description; assign roles accepts roleIds[]; seeds are
    System Admin plus those three permissions only. Invite does not send email.
  version: 4.0.0
servers:
  - url: /v1
    description: Versioned API prefix
tags:
  - name: Auth
  - name: Me
  - name: Status
  - name: Settings
paths:
  /auth/microsoft:
    post:
      operationId: exchangeMicrosoftToken
      summary: Exchange a Microsoft ID token for FlyAccounts tokens
      description: >
        Validates the Microsoft ID token for the configured organizational
        tenant and SPA client id. Personal accounts and unknown directories
        are rejected and MUST NOT create a user. On success, upserts the user.
        If the work email matches an active invite (case-insensitive), copies
        invite roles onto the user, sets entryPath to invite, and consumes
        the invite. Otherwise a newly created user has entryPath organization.
        Then, if combined permissions still lack manage_users and
        the work email matches INITIAL_ADMIN_EMAIL, assigns the seeded System
        Admin role. Returns an access JWT plus a refresh token.
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MicrosoftTokenRequest"
      responses:
        "200":
          description: Signed in. Store accessToken and refreshToken in localStorage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          description: Invalid, expired, personal, or wrong-tenant Microsoft token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidToken:
                  value:
                    code: invalid_token
                    message: Microsoft sign-in could not be verified.
                personalAccount:
                  value:
                    code: personal_account
                    message: Personal Microsoft accounts are not accepted.
                unknownTenant:
                  value:
                    code: unknown_tenant
                    message: This Microsoft directory is not accepted.

  /auth/refresh:
    post:
      operationId: refreshSession
      summary: Rotate refresh token and issue a new access JWT
      description: >
        Redeems a valid refresh token, revokes it, and returns a new pair.
        Reuse of a rotated or revoked token revokes the token family and
        returns 401.
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: New access and refresh tokens. Replace both in localStorage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          description: Unknown, expired, revoked, or reused refresh token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: invalid_token
                message: Refresh token is not valid.

  /auth/logout:
    post:
      operationId: logout
      summary: Sign out
      description: >
        Revokes the refresh token (and its family) associated with this
        session. The client MUST then remove tokens from localStorage.
      tags:
        - Auth
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "204":
          description: Signed out.
        "401":
          description: Missing or invalid access JWT.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /me:
    get:
      operationId: getMe
      summary: Current person, roles, combined permissions, and landing
      description: >
        Allowed for any signed-in person. Combined permissions are the union
        of permissions from all assigned roles, loaded from the database for
        this request. landing.sensitiveFinancialFields is present only when
        view_sensitive_financial_fields is in that set. landing.sections
        includes only sections the combined set allows.
      tags:
        - Me
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current session identity and landing payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
              examples:
                pending:
                  summary: Signed in with no roles
                  value:
                    id: "00000000-0000-0000-0000-000000000001"
                    displayName: Alex Example
                    upn: alex@contoso.com
                    roles: []
                    permissions: []
                    landing:
                      accessState: pending
                      sections: []
                authorized:
                  summary: Combined landing with sensitive fields
                  value:
                    id: "00000000-0000-0000-0000-000000000002"
                    displayName: Alex Example
                    upn: alex@contoso.com
                    roles:
                      - id: "00000000-0000-0000-0000-0000000000a1"
                        name: Finance User
                      - id: "00000000-0000-0000-0000-0000000000a2"
                        name: HR User
                    permissions:
                      - view_sensitive_financial_fields
                      - finance_landing
                      - hr_landing
                    landing:
                      accessState: authorized
                      sensitiveFinancialFields:
                        cost: "1000.00"
                        margin: "250.00"
                      sections:
                        - code: finance_landing
                          title: Finance
                          body: Content allowed by finance_landing.
                        - code: hr_landing
                          title: HR
                          body: Content allowed by hr_landing.
        "401":
          description: Missing or invalid access JWT.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /status:
    get:
      operationId: getStatus
      summary: Working-and-connected check
      description: >
        Same StatusResponse as foundation, but not public. HTTP 200 means the
        frontend reached the backend (connected successfully), even if database
        or storage is unavailable. Requires a valid access JWT and at least one
        assigned role. Unsigned callers receive 401. Signed-in callers with no
        roles receive 403.
      tags:
        - Status
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Backend handled the request for an authorized person.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
              examples:
                allOk:
                  summary: Backend, database, and storage reachable
                  value:
                    service: ok
                    database: ok
                    storage: ok
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Signed in with no roles (pending access).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: pending_access
                message: A recognized role is required.

  /people:
    get:
      operationId: listPeople
      summary: Signed-in people and unused invites
      description: >
        Requires manage_users in the caller's combined permissions.
        Returns a union of Users and active Invites. Unused invites have
        personType invite and status invited. Signed-in people have
        personType user and status pending or active.
      tags:
        - Settings
      security:
        - bearerAuth: []
      responses:
        "200":
          description: People and unused invites with roles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PeopleResponse"
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Combined permissions do not include the required manage_* permission.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /roles:
    get:
      operationId: listRoles
      summary: Roles with attached permissions
      description: >
        Requires manage_roles. Returns roles as data, including
        attached existing permissions. Creating permission types is not
        available on this operation.
      tags:
        - Settings
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Roles and their attached permissions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RolesResponse"
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Combined permissions do not include the required manage_* permission.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createRole
      summary: Create a role
      description: >
        Requires manage_roles. Name is required and MUST be unique.
        Existing permissions are attached with a later call, not created here.
      tags:
        - Settings
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoleRequest"
      responses:
        "201":
          description: Created role with attached permissions (none yet).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Combined permissions do not include the required manage_* permission.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Another role already uses this name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: duplicate_role_name
                message: A role with that name already exists.

  /people/{userId}:
    delete:
      operationId: removePerson
      summary: Remove a signed-in person
      description: >
        Requires manage_users. Removes a listed User and their
        role assignments. Refresh tokens for that person are revoked. Does
        not prevent a later organization-based sign-in by the same account.
        Refused when the change would leave zero signed-in people whose
        combined permissions include manage_users. Unused invites
        are cancelled with DELETE /people/invites/{inviteId}, not this
        operation.
      tags:
        - Settings
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "204":
          description: Person removed.
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Combined permissions do not include the required manage_* permission.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Person not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Would remove the last access-administration grant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: last_admin_required
                message: At least one person with manage_users must remain.

  /people/{userId}/roles:
    post:
      operationId: assignRoles
      summary: Assign one or more existing roles
      description: >
        Adds the roles without replacing roles the person already has.
        Duplicate assignment of any role is refused. Requires manage_users.
      tags:
        - Settings
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignRoleRequest"
      responses:
        "200":
          description: Person after the assignment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Combined permissions do not include the required manage_* permission.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Person or role not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The person already has this role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: duplicate_assignment
                message: That role is already assigned.

  /people/{userId}/roles/{roleId}:
    delete:
      operationId: revokeRole
      summary: Revoke one assigned role
      description: >
        Removes one assignment. Remaining roles stay. If none remain, the
        person has no roles (pending access on their next use). Refused when
        the change would leave zero signed-in people whose combined
        permissions include manage_users. Unused invites do not
        count as administrators.
      tags:
        - Settings
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/RoleId"
      responses:
        "200":
          description: Person after the revoke.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Combined permissions do not include the required manage_* permission.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Person, role, or assignment not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Would remove the last access-administration grant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: last_admin_required
                message: At least one person with manage_users must remain.

  /people/invites:
    post:
      operationId: createInvite
      summary: Invite a person by organizational work email
      description: >
        Requires manage_users. Creates an unused invite with zero
        or more existing roles. The invited person cannot use the application
        until they sign in. Duplicate active invite of the same email is
        refused. Invite of an email that already belongs to a listed User
        is refused. Sending email is not part of this operation.
      tags:
        - Settings
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInviteRequest"
      responses:
        "201":
          description: Invite recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Combined permissions do not include the required manage_* permission.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: A listed roleId was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already invited or already belongs to a listed person.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                duplicateInvite:
                  value:
                    code: duplicate_invite
                    message: That email is already invited.
                alreadyPresent:
                  value:
                    code: already_present
                    message: That person is already listed.

  /people/invites/{inviteId}:
    delete:
      operationId: cancelInvite
      summary: Cancel an unused invite
      description: >
        Requires manage_users. Removes an unused invite from the
        list. Does not prevent a later organization-based sign-in by that
        email. Consumed invites cannot be cancelled.
      tags:
        - Settings
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/InviteId"
      responses:
        "204":
          description: Invite cancelled.
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Combined permissions do not include the required manage_* permission.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Active unused invite not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /people/invites/{inviteId}/roles:
    post:
      operationId: assignInviteRoles
      summary: Assign one or more existing roles to an unused invite
      description: >
        Adds the roles without replacing roles the invite already has.
        Duplicate assignment of any role is refused. Requires manage_users.
      tags:
        - Settings
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/InviteId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignRoleRequest"
      responses:
        "200":
          description: Invite person after the assignment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Combined permissions do not include the required manage_* permission.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Invite or role not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The invite already has this role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: duplicate_assignment
                message: That role is already assigned.

  /people/invites/{inviteId}/roles/{roleId}:
    delete:
      operationId: revokeInviteRole
      summary: Revoke one role from an unused invite
      description: >
        Removes one InviteRole. Remaining roles stay. Last-admin does not
        apply (unused invites cannot administer). Requires manage_users.
      tags:
        - Settings
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/InviteId"
        - $ref: "#/components/parameters/RoleId"
      responses:
        "200":
          description: Invite person after the revoke.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Combined permissions do not include the required manage_* permission.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Invite, role, or assignment not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /roles/{roleId}:
    patch:
      operationId: updateRole
      summary: Change a role name or description
      description: >
        Requires manage_roles. Name MUST remain unique. Authorization
        still follows attached permissions, not the display name.
      tags:
        - Settings
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RoleId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRoleRequest"
      responses:
        "200":
          description: Updated role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Combined permissions do not include the required manage_* permission.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Role not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Another role already uses this name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: duplicate_role_name
                message: A role with that name already exists.
    delete:
      operationId: deleteRole
      summary: Delete an unused role
      description: >
        Requires manage_roles. Refused while any User or active
        Invite is assigned the role. Refused when deleting would leave zero
        signed-in people whose combined permissions include
        manage_users.
      tags:
        - Settings
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RoleId"
      responses:
        "204":
          description: Role deleted.
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Combined permissions do not include the required manage_* permission.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Role not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Role is still assigned, or last access-administration path.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                stillAssigned:
                  value:
                    code: role_still_assigned
                    message: That role is still assigned.
                lastAdmin:
                  value:
                    code: last_admin_required
                    message: At least one person with manage_users must remain.

  /roles/{roleId}/permissions:
    post:
      operationId: attachPermission
      summary: Attach an existing permission to a role
      description: >
        Adds the permission without replacing permissions the role already
        has. Duplicate attach is refused. Creating permission types is not
        available. Requires manage_roles. Refused when the change
        would leave zero signed-in people with manage_users (does
        not apply to attach of a new grant).
      tags:
        - Settings
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RoleId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttachPermissionRequest"
      responses:
        "200":
          description: Role after the attach.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Combined permissions do not include the required manage_* permission.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Role or permission not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The role already has this permission.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: duplicate_permission
                message: That permission is already attached.

  /roles/{roleId}/permissions/{permissionId}:
    delete:
      operationId: detachPermission
      summary: Detach a permission from a role
      description: >
        Remaining permissions stay. Every person assigned the role uses the
        updated combined set on their next request. Refused when the change
        would leave zero signed-in people whose combined permissions include
        manage_users. Requires manage_roles.
      tags:
        - Settings
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RoleId"
        - $ref: "#/components/parameters/PermissionId"
      responses:
        "200":
          description: Role after the detach.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Combined permissions do not include the required manage_* permission.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Role, permission, or attachment not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Would remove the last access-administration grant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: last_admin_required
                message: At least one person with manage_users must remain.

  /permissions:
    get:
      operationId: listPermissions
      summary: Existing permission types
      description: >
        Requires manage_permissions. Read-only catalog of permission
        types that roles may attach, grouped by module. Each row is
        module-level when action is omitted. Creating, renaming, or
        deleting permission types is not available.
      tags:
        - Settings
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Existing permissions, including module and optional action.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionsResponse"
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Combined permissions do not include the required manage_* permission.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: FlyAccounts access JWT from POST /auth/microsoft or POST /auth/refresh.
  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RoleId:
      name: roleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InviteId:
      name: inviteId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PermissionId:
      name: permissionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - invalid_token
            - personal_account
            - unknown_tenant
            - unauthorized
            - forbidden
            - pending_access
            - not_found
            - duplicate_assignment
            - last_admin_required
            - duplicate_invite
            - already_present
            - duplicate_role_name
            - role_still_assigned
            - duplicate_permission
        message:
          type: string
    MicrosoftTokenRequest:
      type: object
      additionalProperties: false
      required:
        - idToken
      properties:
        idToken:
          type: string
          description: Microsoft ID token from MSAL for the configured tenant.
    RefreshTokenRequest:
      type: object
      additionalProperties: false
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
    TokenResponse:
      type: object
      additionalProperties: false
      required:
        - accessToken
        - refreshToken
        - tokenType
        - expiresIn
        - user
      properties:
        accessToken:
          type: string
          description: Short-lived JWT; store in localStorage; send as Bearer.
        refreshToken:
          type: string
          description: Opaque token; store in localStorage; send to /auth/refresh.
        tokenType:
          type: string
          enum: [bearer]
        expiresIn:
          type: integer
          minimum: 1
          description: Access token lifetime in seconds.
        user:
          $ref: "#/components/schemas/MeResponse"
    RoleSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
    Permission:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - permission
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Display label (Permission Name).
        permission:
          type: string
          description: Stable key used in authorization checks. Exact match only.
        description:
          type: string
          description: Optional human-readable explanation.
    Role:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - permissions
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
    LandingSection:
      type: object
      additionalProperties: false
      required:
        - code
        - title
        - body
      properties:
        code:
          type: string
          description: Permission code that allowed this section.
        title:
          type: string
        body:
          type: string
    SensitiveFinancialFields:
      type: object
      additionalProperties: false
      required:
        - cost
        - margin
      properties:
        cost:
          type: string
          description: Demo cost shown only when permitted. Decimal string; not a posted document.
        margin:
          type: string
          description: Demo margin shown only when permitted. Decimal string; not a posted document.
    Landing:
      type: object
      additionalProperties: false
      required:
        - accessState
        - sections
      properties:
        accessState:
          type: string
          enum: [pending, authorized]
        sensitiveFinancialFields:
          $ref: "#/components/schemas/SensitiveFinancialFields"
          description: Omitted when view_sensitive_financial_fields is not in the combined set.
        sections:
          type: array
          items:
            $ref: "#/components/schemas/LandingSection"
    MeResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - displayName
        - upn
        - roles
        - permissions
        - landing
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        upn:
          type: string
        roles:
          type: array
          items:
            $ref: "#/components/schemas/RoleSummary"
        permissions:
          type: array
          items:
            type: string
          description: Combined permission codes for this request.
        landing:
          $ref: "#/components/schemas/Landing"
    Person:
      type: object
      additionalProperties: false
      required:
        - id
        - personType
        - email
        - status
        - roles
      properties:
        id:
          type: string
          format: uuid
          description: User.id when personType is user; Invite.id when invite.
        personType:
          type: string
          enum: [user, invite]
        email:
          type: string
          description: User.upn or Invite.email.
        displayName:
          type: string
          description: Present after sign-in; omitted for unused invites.
        status:
          type: string
          enum: [invited, pending, active]
        entryPath:
          type: string
          enum: [invite, organization]
          description: How a signed-in User entered. Omitted for unused invites.
        roles:
          type: array
          items:
            $ref: "#/components/schemas/RoleSummary"
    PeopleResponse:
      type: object
      additionalProperties: false
      required:
        - people
      properties:
        people:
          type: array
          items:
            $ref: "#/components/schemas/Person"
    RolesResponse:
      type: object
      additionalProperties: false
      required:
        - roles
      properties:
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
    PermissionModuleGroup:
      type: object
      additionalProperties: false
      required:
        - module
        - permissions
      properties:
        module:
          type: string
          description: Catalog grouping key (e.g. settings). Not an authorization key.
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
    PermissionsResponse:
      type: object
      additionalProperties: false
      required:
        - modules
      properties:
        modules:
          type: array
          items:
            $ref: "#/components/schemas/PermissionModuleGroup"
    AssignRoleRequest:
      type: object
      additionalProperties: false
      required:
        - roleIds
      properties:
        roleIds:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid
    CreateInviteRequest:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          type: string
          description: Organizational work email. Matching on sign-in is case-insensitive.
        roleIds:
          type: array
          items:
            type: string
            format: uuid
          default: []
          description: Existing roles to pre-assign. Empty means invite with no roles.
    CreateRoleRequest:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
    UpdateRoleRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
    AttachPermissionRequest:
      type: object
      additionalProperties: false
      required:
        - permissionId
      properties:
        permissionId:
          type: string
          format: uuid
    StatusResponse:
      type: object
      additionalProperties: false
      required:
        - service
        - database
        - storage
      properties:
        service:
          type: string
          enum: [ok]
          description: Backend process handled GET /v1/status.
        database:
          type: string
          enum: [ok, unavailable]
          description: Result of a PostgreSQL reachability check (SELECT 1).
        storage:
          type: string
          enum: [ok, unavailable]
          description: Result of an S3-compatible reachability check (HeadBucket).
