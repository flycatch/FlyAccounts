openapi: 3.0.3
info:
  title: FlyAccounts
  description: 'FlyAccounts API 6.0.0: global Clients CRUD; server-side search/pagination on clients,
    contracts, people, roles; contracts require clientId on create.'
  version: 6.0.0
servers:
- url: /v1
  description: Versioned API prefix
tags:
- name: Auth
- name: Me
- name: Status
- name: Settings
- name: Entities
- name: Contracts
- name: Clients
paths:
  /auth/microsoft:
    post:
      operationId: exchangeMicrosoftToken
      summary: Exchange a Microsoft ID token for FlyAccounts tokens
      description: 'Validates the Microsoft ID token for the configured organizational tenant and SPA
        client id. Personal accounts and unknown directories are rejected and MUST NOT create a user.
        On success, upserts the user. If the work email matches an active invite (case-insensitive), copies
        invite roles onto the user, sets entryPath to invite, and consumes the invite. Otherwise a newly
        created user has entryPath organization. Then, if combined permissions still lack manage_users
        and the work email matches INITIAL_ADMIN_EMAIL, assigns the seeded System Admin role. Returns
        an access JWT plus a refresh token.

        '
      tags:
      - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MicrosoftTokenRequest'
      responses:
        '200':
          description: Signed in. Store accessToken and refreshToken in localStorage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Invalid, expired, personal, or wrong-tenant Microsoft token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidToken:
                  value:
                    code: invalid_token
                    message: Microsoft sign-in could not be verified.
                personalAccount:
                  value:
                    code: personal_account
                    message: Personal Microsoft accounts are not accepted.
                unknownTenant:
                  value:
                    code: unknown_tenant
                    message: This Microsoft directory is not accepted.
  /auth/refresh:
    post:
      operationId: refreshSession
      summary: Rotate refresh token and issue a new access JWT
      description: 'Redeems a valid refresh token, revokes it, and returns a new pair. Reuse of a rotated
        or revoked token revokes the token family and returns 401.

        '
      tags:
      - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: New access and refresh tokens. Replace both in localStorage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Unknown, expired, revoked, or reused refresh token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: invalid_token
                message: Refresh token is not valid.
  /auth/logout:
    post:
      operationId: logout
      summary: Sign out
      description: 'Revokes the refresh token (and its family) associated with this session. The client
        MUST then remove tokens from localStorage.

        '
      tags:
      - Auth
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '204':
          description: Signed out.
        '401':
          description: Missing or invalid access JWT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /me:
    get:
      operationId: getMe
      summary: Current person, roles, combined permissions, and landing
      description: 'Allowed for any signed-in person. Combined permissions are the union of permissions
        from all assigned roles, loaded from the database for this request. landing.sensitiveFinancialFields
        is present only when view_sensitive_financial_fields is in that set. landing.sections includes
        only sections the combined set allows.

        '
      tags:
      - Me
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Current session identity and landing payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
              examples:
                pending:
                  summary: Signed in with no roles
                  value:
                    id: 00000000-0000-0000-0000-000000000001
                    displayName: Alex Example
                    upn: alex@contoso.com
                    roles: []
                    permissions: []
                    landing:
                      accessState: pending
                      sections: []
                authorized:
                  summary: Combined landing with sensitive fields
                  value:
                    id: 00000000-0000-0000-0000-000000000002
                    displayName: Alex Example
                    upn: alex@contoso.com
                    roles:
                    - id: 00000000-0000-0000-0000-0000000000a1
                      name: Finance User
                    - id: 00000000-0000-0000-0000-0000000000a2
                      name: HR User
                    permissions:
                    - view_sensitive_financial_fields
                    - finance_landing
                    - hr_landing
                    landing:
                      accessState: authorized
                      sensitiveFinancialFields:
                        cost: '1000.00'
                        margin: '250.00'
                      sections:
                      - code: finance_landing
                        title: Finance
                        body: Content allowed by finance_landing.
                      - code: hr_landing
                        title: HR
                        body: Content allowed by hr_landing.
        '401':
          description: Missing or invalid access JWT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /status:
    get:
      operationId: getStatus
      summary: Working-and-connected check
      description: 'Same StatusResponse as foundation, but not public. HTTP 200 means the frontend reached
        the backend (connected successfully), even if database or storage is unavailable. Requires a valid
        access JWT and at least one assigned role. Unsigned callers receive 401. Signed-in callers with
        no roles receive 403.

        '
      tags:
      - Status
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Backend handled the request for an authorized person.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
              examples:
                allOk:
                  summary: Backend, database, and storage reachable
                  value:
                    service: ok
                    database: ok
                    storage: ok
        '401':
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Signed in with no roles (pending access).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: pending_access
                message: A recognized role is required.
  /people:
    get:
      operationId: listPeople
      summary: Signed-in people and unused invites
      description: 'Requires manage_users in the caller''s combined permissions. Returns a union of Users
        and active Invites. Unused invites have personType invite and status invited. Signed-in people
        have personType user and status pending or active.

        '
      tags:
      - Settings
      security:
      - bearerAuth: []
      responses:
        '200':
          description: People and unused invites with roles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeopleResponse'
        '401':
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Combined permissions do not include the required manage_* permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - &id001
        $ref: '#/components/parameters/ListSearch'
      - &id002
        $ref: '#/components/parameters/ListPage'
      - &id003
        $ref: '#/components/parameters/ListPageSize'
  /roles:
    get:
      operationId: listRoles
      summary: Roles with attached permissions
      description: 'Requires manage_roles. Returns roles as data, including attached existing permissions.
        Creating permission types is not available on this operation.

        '
      tags:
      - Settings
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Roles and their attached permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolesResponse'
        '401':
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Combined permissions do not include the required manage_* permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - *id001
      - *id002
      - *id003
    post:
      operationId: createRole
      summary: Create a role
      description: 'Requires manage_roles. Name is required and MUST be unique. Existing permissions are
        attached with a later call, not created here.

        '
      tags:
      - Settings
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoleRequest'
      responses:
        '201':
          description: Created role with attached permissions (none yet).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '401':
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Combined permissions do not include the required manage_* permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Another role already uses this name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: duplicate_role_name
                message: A role with that name already exists.
  /people/{userId}:
    delete:
      operationId: removePerson
      summary: Remove a signed-in person
      description: 'Requires manage_users. Removes a listed User and their role assignments. Refresh tokens
        for that person are revoked. Does not prevent a later organization-based sign-in by the same account.
        Refused when the change would leave zero signed-in people whose combined permissions include manage_users.
        Unused invites are cancelled with DELETE /people/invites/{inviteId}, not this operation.

        '
      tags:
      - Settings
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: Person removed.
        '401':
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Combined permissions do not include the required manage_* permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Person not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Would remove the last access-administration grant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: last_admin_required
                message: At least one person with manage_users must remain.
  /people/{userId}/roles:
    post:
      operationId: assignRoles
      summary: Assign one or more existing roles
      description: 'Adds the roles without replacing roles the person already has. Duplicate assignment
        of any role is refused. Requires manage_users.

        '
      tags:
      - Settings
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignRoleRequest'
      responses:
        '200':
          description: Person after the assignment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
        '401':
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Combined permissions do not include the required manage_* permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Person or role not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The person already has this role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: duplicate_assignment
                message: That role is already assigned.
  /people/{userId}/roles/{roleId}:
    delete:
      operationId: revokeRole
      summary: Revoke one assigned role
      description: 'Removes one assignment. Remaining roles stay. If none remain, the person has no roles
        (pending access on their next use). Refused when the change would leave zero signed-in people
        whose combined permissions include manage_users. Unused invites do not count as administrators.

        '
      tags:
      - Settings
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/UserId'
      - $ref: '#/components/parameters/RoleId'
      responses:
        '200':
          description: Person after the revoke.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
        '401':
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Combined permissions do not include the required manage_* permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Person, role, or assignment not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Would remove the last access-administration grant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: last_admin_required
                message: At least one person with manage_users must remain.
  /people/invites:
    post:
      operationId: createInvite
      summary: Invite a person by organizational work email
      description: 'Requires manage_users. Creates an unused invite with zero or more existing roles.
        The invited person cannot use the application until they sign in. Duplicate active invite of the
        same email is refused. Invite of an email that already belongs to a listed User is refused. Sending
        email is not part of this operation.

        '
      tags:
      - Settings
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInviteRequest'
      responses:
        '201':
          description: Invite recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
        '401':
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Combined permissions do not include the required manage_* permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: A listed roleId was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email already invited or already belongs to a listed person.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                duplicateInvite:
                  value:
                    code: duplicate_invite
                    message: That email is already invited.
                alreadyPresent:
                  value:
                    code: already_present
                    message: That person is already listed.
  /people/invites/{inviteId}:
    delete:
      operationId: cancelInvite
      summary: Cancel an unused invite
      description: 'Requires manage_users. Removes an unused invite from the list. Does not prevent a
        later organization-based sign-in by that email. Consumed invites cannot be cancelled.

        '
      tags:
      - Settings
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/InviteId'
      responses:
        '204':
          description: Invite cancelled.
        '401':
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Combined permissions do not include the required manage_* permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Active unused invite not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /people/invites/{inviteId}/roles:
    post:
      operationId: assignInviteRoles
      summary: Assign one or more existing roles to an unused invite
      description: 'Adds the roles without replacing roles the invite already has. Duplicate assignment
        of any role is refused. Requires manage_users.

        '
      tags:
      - Settings
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/InviteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignRoleRequest'
      responses:
        '200':
          description: Invite person after the assignment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
        '401':
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Combined permissions do not include the required manage_* permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Invite or role not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The invite already has this role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: duplicate_assignment
                message: That role is already assigned.
  /people/invites/{inviteId}/roles/{roleId}:
    delete:
      operationId: revokeInviteRole
      summary: Revoke one role from an unused invite
      description: 'Removes one InviteRole. Remaining roles stay. Last-admin does not apply (unused invites
        cannot administer). Requires manage_users.

        '
      tags:
      - Settings
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/InviteId'
      - $ref: '#/components/parameters/RoleId'
      responses:
        '200':
          description: Invite person after the revoke.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
        '401':
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Combined permissions do not include the required manage_* permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Invite, role, or assignment not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /roles/{roleId}:
    patch:
      operationId: updateRole
      summary: Change a role name or description
      description: 'Requires manage_roles. Name MUST remain unique. Authorization still follows attached
        permissions, not the display name.

        '
      tags:
      - Settings
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/RoleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoleRequest'
      responses:
        '200':
          description: Updated role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '401':
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Combined permissions do not include the required manage_* permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Role not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Another role already uses this name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: duplicate_role_name
                message: A role with that name already exists.
    delete:
      operationId: deleteRole
      summary: Delete an unused role
      description: 'Requires manage_roles. Refused while any User or active Invite is assigned the role.
        Refused when deleting would leave zero signed-in people whose combined permissions include manage_users.

        '
      tags:
      - Settings
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/RoleId'
      responses:
        '204':
          description: Role deleted.
        '401':
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Combined permissions do not include the required manage_* permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Role not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Role is still assigned, or last access-administration path.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                stillAssigned:
                  value:
                    code: role_still_assigned
                    message: That role is still assigned.
                lastAdmin:
                  value:
                    code: last_admin_required
                    message: At least one person with manage_users must remain.
  /roles/{roleId}/permissions:
    post:
      operationId: attachPermission
      summary: Attach an existing permission to a role
      description: 'Adds the permission without replacing permissions the role already has. Duplicate
        attach is refused. Creating permission types is not available. Requires manage_roles. Refused
        when the change would leave zero signed-in people with manage_users (does not apply to attach
        of a new grant).

        '
      tags:
      - Settings
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/RoleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachPermissionRequest'
      responses:
        '200':
          description: Role after the attach.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '401':
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Combined permissions do not include the required manage_* permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Role or permission not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The role already has this permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: duplicate_permission
                message: That permission is already attached.
  /roles/{roleId}/permissions/{permissionId}:
    delete:
      operationId: detachPermission
      summary: Detach a permission from a role
      description: 'Remaining permissions stay. Every person assigned the role uses the updated combined
        set on their next request. Refused when the change would leave zero signed-in people whose combined
        permissions include manage_users. Requires manage_roles.

        '
      tags:
      - Settings
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/RoleId'
      - $ref: '#/components/parameters/PermissionId'
      responses:
        '200':
          description: Role after the detach.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '401':
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Combined permissions do not include the required manage_* permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Role, permission, or attachment not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Would remove the last access-administration grant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: last_admin_required
                message: At least one person with manage_users must remain.
  /permissions:
    get:
      operationId: listPermissions
      summary: Existing permission types
      description: 'Requires manage_permissions. Read-only catalog of permission types that roles may
        attach, grouped by module. Each row is module-level when action is omitted. Creating, renaming,
        or deleting permission types is not available.

        '
      tags:
      - Settings
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Existing permissions, including module and optional action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionsResponse'
        '401':
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Combined permissions do not include the required manage_* permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /entities:
    get:
      operationId: listEntities
      summary: List legal entities for the Entity Switcher
      tags:
      - Entities
      security: &id005
      - bearerAuth: []
      responses:
        '200':
          description: Active legal entities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntitiesResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden or pending access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /clients:
    get:
      operationId: listClients
      summary: List clients with search and pagination
      description: Requires manage_contracts. Global client master (not entity-scoped).
      tags:
      - Clients
      security:
      - bearerAuth: []
      parameters:
      - *id001
      - *id002
      - *id003
      responses:
        '200':
          description: Paginated clients.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientsResponse'
        '401': &id004
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403': *id004
    post:
      operationId: createClient
      summary: Create a client
      description: Requires manage_contracts. Name must be unique (case-insensitive).
      tags:
      - Clients
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateClientRequest'
      responses:
        '201':
          description: Client created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
        '400': *id004
        '401': *id004
        '403': *id004
        '409':
          description: Duplicate client name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          example:
            code: duplicate_client_name
            message: A client with that name already exists.
  /clients/{clientId}:
    get:
      operationId: getClient
      summary: Get a client
      tags:
      - Clients
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/ClientId'
      responses:
        '200':
          description: Client.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
        '401': *id004
        '403': *id004
        '404': *id004
    patch:
      operationId: updateClient
      summary: Update a client
      tags:
      - Clients
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/ClientId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateClientRequest'
      responses:
        '200':
          description: Updated client.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
        '400': *id004
        '401': *id004
        '403': *id004
        '404': *id004
        '409': *id004
    delete:
      operationId: deleteClient
      summary: Delete a client
      description: Refused with client_in_use when non-deleted contracts reference the client.
      tags:
      - Clients
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/ClientId'
      responses:
        '204':
          description: Deleted.
        '401': *id004
        '403': *id004
        '404': *id004
        '409':
          description: Client is referenced by contracts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          example:
            code: client_in_use
            message: This client is linked to 2 contracts.
  /contracts:
    get:
      operationId: listContracts
      summary: List contracts scoped by X-Entity-Id
      description: Requires manage_contracts. Financial amount fields are omitted when the caller lacks
        view_contract_financials. Supports search (reference, closure owner, client name), status, and
        server-side pagination.
      tags:
      - Contracts
      security: *id005
      parameters:
      - &id006
        $ref: '#/components/parameters/EntityIdHeader'
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - all
          - active
          - on_hold
          - support
          - cancelled
          default: all
      - *id001
      - *id002
      - *id003
      responses:
        '200':
          description: Contracts in entity context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractsResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: createContract
      summary: Create a Step-1 draft contract
      description: Requires manage_contracts and a concrete X-Entity-Id. Creates a draft with server-generated
        reference. Later steps use PATCH.
      tags:
      - Contracts
      security: *id005
      parameters: &id007
      - *id006
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateContractRequest'
      responses:
        '201':
          description: Draft created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractSummary'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden or All Entities create rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /contracts/files:
    post:
      operationId: uploadContractFile
      summary: Upload a client contract file (.pdf, .doc, or .docx)
      tags:
      - Contracts
      security: *id005
      parameters: *id007
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractFileUploadResponse'
        '400':
          description: Invalid file type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /contracts/{contractId}:
    get:
      operationId: getContract
      summary: Get a contract by id
      tags:
      - Contracts
      security: &id008
      - bearerAuth: []
      parameters:
      - &id009
        name: contractId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - &id010
        $ref: '#/components/parameters/EntityIdHeader'
      responses:
        '200':
          description: Contract detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractDetail'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      operationId: updateContract
      summary: Update/complete a draft contract (steps 2–4)
      tags:
      - Contracts
      security: *id008
      parameters:
      - *id009
      - *id010
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateContractRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractDetail'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: deleteContract
      summary: Soft-delete a contract (Finance)
      description: Requires manage_contracts and view_contract_financials.
      tags:
      - Contracts
      security: &id011
      - bearerAuth: []
      parameters:
      - name: contractId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/EntityIdHeader'
      responses:
        '204':
          description: Deleted
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /contracts/closure-owners:
    get:
      operationId: listClosureOwners
      summary: List users eligible as closure owners
      tags:
      - Contracts
      security: *id011
      responses:
        '200':
          description: Owners
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClosureOwnersResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: FlyAccounts access JWT from POST /auth/microsoft or POST /auth/refresh.
  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RoleId:
      name: roleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InviteId:
      name: inviteId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PermissionId:
      name: permissionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EntityIdHeader:
      name: X-Entity-Id
      in: header
      required: false
      description: Active legal entity UUID, or * for All Entities consolidated. Omit means All Entities.
        Create requires a concrete UUID.
      schema:
        type: string
    ListSearch:
      name: search
      in: query
      required: false
      description: Case-insensitive search across relevant text fields.
      schema:
        type: string
    ListPage:
      name: page
      in: query
      required: false
      description: 1-based page index.
      schema:
        type: integer
        minimum: 1
        default: 1
    ListPageSize:
      name: pageSize
      in: query
      required: false
      description: Page size.
      schema:
        type: integer
        enum:
        - 10
        - 25
        - 50
        default: 10
    ClientId:
      name: clientId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
      - code
      - message
      properties:
        code:
          type: string
          enum:
          - invalid_token
          - personal_account
          - unknown_tenant
          - unauthorized
          - forbidden
          - pending_access
          - not_found
          - duplicate_assignment
          - last_admin_required
          - duplicate_invite
          - already_present
          - duplicate_role_name
          - role_still_assigned
          - duplicate_permission
          - validation_error
          - entity_context_required
          - invalid_currency
          - invalid_file_type
          - client_in_use
          - duplicate_client_name
        message:
          type: string
    MicrosoftTokenRequest:
      type: object
      additionalProperties: false
      required:
      - idToken
      properties:
        idToken:
          type: string
          description: Microsoft ID token from MSAL for the configured tenant.
    RefreshTokenRequest:
      type: object
      additionalProperties: false
      required:
      - refreshToken
      properties:
        refreshToken:
          type: string
    TokenResponse:
      type: object
      additionalProperties: false
      required:
      - accessToken
      - refreshToken
      - tokenType
      - expiresIn
      - user
      properties:
        accessToken:
          type: string
          description: Short-lived JWT; store in localStorage; send as Bearer.
        refreshToken:
          type: string
          description: Opaque token; store in localStorage; send to /auth/refresh.
        tokenType:
          type: string
          enum:
          - bearer
        expiresIn:
          type: integer
          minimum: 1
          description: Access token lifetime in seconds.
        user:
          $ref: '#/components/schemas/MeResponse'
    RoleSummary:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
    Permission:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - permission
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Display label (Permission Name).
        permission:
          type: string
          description: Stable key used in authorization checks. Exact match only.
        description:
          type: string
          description: Optional human-readable explanation.
    Role:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - permissions
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
    LandingSection:
      type: object
      additionalProperties: false
      required:
      - code
      - title
      - body
      properties:
        code:
          type: string
          description: Permission code that allowed this section.
        title:
          type: string
        body:
          type: string
    SensitiveFinancialFields:
      type: object
      additionalProperties: false
      required:
      - cost
      - margin
      properties:
        cost:
          type: string
          description: Demo cost shown only when permitted. Decimal string; not a posted document.
        margin:
          type: string
          description: Demo margin shown only when permitted. Decimal string; not a posted document.
    Landing:
      type: object
      additionalProperties: false
      required:
      - accessState
      - sections
      properties:
        accessState:
          type: string
          enum:
          - pending
          - authorized
        sensitiveFinancialFields:
          $ref: '#/components/schemas/SensitiveFinancialFields'
          description: Omitted when view_sensitive_financial_fields is not in the combined set.
        sections:
          type: array
          items:
            $ref: '#/components/schemas/LandingSection'
    MeResponse:
      type: object
      additionalProperties: false
      required:
      - id
      - displayName
      - upn
      - roles
      - permissions
      - landing
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        upn:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleSummary'
        permissions:
          type: array
          items:
            type: string
          description: Combined permission codes for this request.
        landing:
          $ref: '#/components/schemas/Landing'
    Person:
      type: object
      additionalProperties: false
      required:
      - id
      - personType
      - email
      - status
      - roles
      properties:
        id:
          type: string
          format: uuid
          description: User.id when personType is user; Invite.id when invite.
        personType:
          type: string
          enum:
          - user
          - invite
        email:
          type: string
          description: User.upn or Invite.email.
        displayName:
          type: string
          description: Present after sign-in; omitted for unused invites.
        status:
          type: string
          enum:
          - invited
          - pending
          - active
        entryPath:
          type: string
          enum:
          - invite
          - organization
          description: How a signed-in User entered. Omitted for unused invites.
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleSummary'
    PeopleResponse:
      type: object
      additionalProperties: false
      required:
      - people
      - page
      - pageSize
      - total
      properties:
        people:
          type: array
          items:
            $ref: '#/components/schemas/Person'
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          enum:
          - 10
          - 25
          - 50
        total:
          type: integer
          minimum: 0
    RolesResponse:
      type: object
      additionalProperties: false
      required:
      - roles
      - page
      - pageSize
      - total
      properties:
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          enum:
          - 10
          - 25
          - 50
        total:
          type: integer
          minimum: 0
    PermissionModuleGroup:
      type: object
      additionalProperties: false
      required:
      - module
      - permissions
      properties:
        module:
          type: string
          description: Catalog grouping key (e.g. settings). Not an authorization key.
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
    PermissionsResponse:
      type: object
      additionalProperties: false
      required:
      - modules
      properties:
        modules:
          type: array
          items:
            $ref: '#/components/schemas/PermissionModuleGroup'
    AssignRoleRequest:
      type: object
      additionalProperties: false
      required:
      - roleIds
      properties:
        roleIds:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid
    CreateInviteRequest:
      type: object
      additionalProperties: false
      required:
      - email
      properties:
        email:
          type: string
          description: Organizational work email. Matching on sign-in is case-insensitive.
        roleIds:
          type: array
          items:
            type: string
            format: uuid
          default: []
          description: Existing roles to pre-assign. Empty means invite with no roles.
    CreateRoleRequest:
      type: object
      additionalProperties: false
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
    UpdateRoleRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
    AttachPermissionRequest:
      type: object
      additionalProperties: false
      required:
      - permissionId
      properties:
        permissionId:
          type: string
          format: uuid
    StatusResponse:
      type: object
      additionalProperties: false
      required:
      - service
      - database
      - storage
      properties:
        service:
          type: string
          enum:
          - ok
          description: Backend process handled GET /v1/status.
        database:
          type: string
          enum:
          - ok
          - unavailable
          description: Result of a PostgreSQL reachability check (SELECT 1).
        storage:
          type: string
          enum:
          - ok
          - unavailable
          description: Result of an S3-compatible reachability check (HeadBucket).
    LegalEntity:
      type: object
      additionalProperties: false
      required:
      - id
      - code
      - name
      - allowedCurrencies
      - active
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          enum:
          - entity_a
          - entity_b
          - entity_c
        name:
          type: string
        allowedCurrencies:
          type: array
          items:
            type: string
            enum:
            - INR
            - USD
            - SAR
          minItems: 1
        active:
          type: boolean
    EntitiesResponse:
      type: object
      additionalProperties: false
      required:
      - entities
      properties:
        entities:
          type: array
          items:
            $ref: '#/components/schemas/LegalEntity'
    ContractMilestone:
      type: object
      additionalProperties: false
      required:
      - name
      - value
      - dueConditionOrDate
      - sortOrder
      properties:
        name:
          type: string
        value:
          type: string
          description: Decimal string
        dueConditionOrDate:
          type: string
        sortOrder:
          type: integer
          minimum: 0
    ContractResource:
      type: object
      additionalProperties: false
      required:
      - mode
      properties:
        mode:
          type: string
          enum:
          - inhouse
          - vendor
        resourceUserId:
          type: string
          format: uuid
        resourceName:
          type: string
        allocationPercent:
          type: integer
          minimum: 0
          maximum: 100
        costOfResource:
          type: string
          description: Decimal string; omitted without view_contract_financials
        vendorContractRef:
          type: string
        vendorContractFileKey:
          type: string
        monthlyVendorInvoice:
          type: string
        monthlyVendorInvoiceFileKey:
          type: string
        tdsPaidPayable:
          type: string
        gstPaidPayable:
          type: string
    ContractSummary:
      type: object
      additionalProperties: false
      required:
      - id
      - entityId
      - entityName
      - reference
      - category
      - currency
      - isAmendment
      - createdAt
      - isDraft
      properties:
        id:
          type: string
          format: uuid
        entityId:
          type: string
          format: uuid
        entityName:
          type: string
        reference:
          type: string
        category:
          type: string
          enum:
          - time_and_material
          - data_management
          - contract_staffing
        currency:
          type: string
          enum:
          - INR
          - USD
          - SAR
        isAmendment:
          type: boolean
        parentContractId:
          type: string
          format: uuid
        parentContractReference:
          type: string
        closureOwnerUserId:
          type: string
          format: uuid
        closureOwnerName:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        projectStatus:
          type: string
          enum:
          - active
          - on_hold
          - support
          - cancelled
        pmoNote:
          type: string
        paymentType:
          type: string
          enum:
          - project_value
          - monthly
        projectValue:
          type: string
          description: Omitted without view_contract_financials
        monthlyRate:
          type: string
          description: Omitted without view_contract_financials
        months:
          type: integer
        paymentDisplay:
          type: string
          description: Human-readable payment summary; redacted without view_contract_financials
        resourceType:
          type: string
          enum:
          - inhouse
          - vendor
        clientFileKey:
          type: string
        createdAt:
          type: string
          format: date-time
        isDraft:
          type: boolean
        clientFileName:
          type: string
        clientFileContentType:
          type: string
        clientFileSizeBytes:
          type: integer
        milestones:
          type: array
          items:
            $ref: '#/components/schemas/ContractMilestone'
        resource:
          $ref: '#/components/schemas/ContractResource'
        clientId:
          type: string
          format: uuid
        clientName:
          type: string
    ContractsResponse:
      type: object
      additionalProperties: false
      required:
      - contracts
      - page
      - pageSize
      - total
      properties:
        contracts:
          type: array
          items:
            $ref: '#/components/schemas/ContractSummary'
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          enum:
          - 10
          - 25
          - 50
        total:
          type: integer
          minimum: 0
    CreateContractRequest:
      type: object
      additionalProperties: false
      required:
      - clientFileKey
      - isAmendment
      - category
